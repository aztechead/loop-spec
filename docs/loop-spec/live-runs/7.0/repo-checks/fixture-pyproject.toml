[project]
name = "unitkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
strict = true
files = ["unitkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
